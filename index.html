<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIPPO｜本社</title>
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263348;--border:#334155;
  --text:#e2e8f0;--text2:#94a3b8;--accent:#38bdf8;--green:#4ade80;
  --red:#f87171;--orange:#fb923c;--yellow:#facc15;--purple:#a78bfa;
  --shin:#60a5fa;--kison:#34d399;--kuran:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#1e40af,#0f172a);padding:16px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);justify-content:space-between}
header h1{font-size:1.3rem;font-weight:700;color:#fff}
header .badge{background:#1d4ed8;color:#93c5fd;padding:4px 12px;border-radius:20px;font-size:.75rem}
.subtitle{color:var(--text2);font-size:.85rem;margin-top:4px}
.main-tabs{display:flex;gap:4px;padding:16px 24px 0;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.main-tab{padding:10px 20px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;font-size:.9rem;transition:all .2s;border-radius:6px 6px 0 0}
.main-tab:hover{color:var(--text);background:var(--surface2)}
.region-btn{padding:6px 14px;border:none;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text2);transition:all .2s}
.region-btn.active{background:#1d4ed8;color:#93c5fd}
.region-btn:hover:not(.active){background:var(--surface);color:var(--text)}

.main-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg)}
.content{padding:24px;max-width:1400px;margin:0 auto}
.tab-pane{display:none}.tab-pane.active{display:block}
.person-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.person-tab{padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.person-tab:hover,.person-tab.active{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.kpi-card .label{font-size:.75rem;color:var(--text2);margin-bottom:8px}
.kpi-card .value{font-size:2rem;font-weight:700}
.kpi-card .sub{font-size:.8rem;color:var(--text2);margin-top:4px}
.kpi-card.shin .value{color:var(--shin)}
.kpi-card.kison .value{color:var(--kison)}
.kpi-card.kuran .value{color:var(--kuran)}
.kpi-card.total .value{color:var(--accent)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:20px;margin-bottom:24px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-card h3{font-size:1rem;margin-bottom:16px;color:var(--text);display:flex;align-items:center;gap:8px}
canvas{width:100%!important}
.table-wrap{overflow-x:auto;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{background:var(--surface2);padding:10px 12px;text-align:left;color:var(--text2);font-weight:600;white-space:nowrap;border-bottom:2px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.progress-bar-wrap{width:120px;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress-bar{height:100%;border-radius:4px;transition:width .3s}
.badge-rate{display:inline-block;padding:3px 8px;border-radius:10px;font-size:.75rem;font-weight:600}
.badge-over{background:#065f46;color:#4ade80}
.badge-near{background:#713f12;color:#fde68a}
.badge-low{background:#7f1d1d;color:#fca5a5}
.gap-pos{color:var(--green)}
.gap-neg{color:var(--red)}
.section-title{font-size:1.1rem;font-weight:700;margin:24px 0 16px;display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.goal-form{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.goal-form h3{margin-bottom:16px;color:var(--accent)}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.goal-row{display:flex;flex-direction:column;gap:6px}
.goal-row label{font-size:.8rem;color:var(--text2);font-weight:600}
.goal-inputs{display:flex;gap:8px;flex-wrap:wrap}
.goal-inputs input{width:90px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.85rem}
.goal-inputs input:focus{outline:none;border-color:var(--accent)}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#0f172a}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.8rem}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:12px;border-radius:3px}
.notice{font-size:.75rem;color:var(--text2);margin-bottom:12px;padding:8px 12px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent)}
.print-btn{float:right;padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-size:.8rem}
.print-btn:hover{background:var(--border)}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  header,.main-tabs,.daily-toolbar,.daily-person-tabs,.daily-view-toggle,
  #btn-view-single,#btn-view-all,.print-btn,.btn,.person-tabs,.no-print,.eigyo-toolbar{display:none!important}
  .tab-pane{display:none!important}
  #tab-eigyo.active-print{display:block!important}
  #tab-eigyo.active-print *{color:#000!important;background:#fff!important;border-color:#ccc!important}
  #tab-eigyo.active-print .eigyo-monthly-table th{background:#eee!important;color:#000!important}
  #tab-eigyo.active-print .eigyo-monthly-table td{color:#000!important}
  #tab-eigyo.active-print .cur-month{color:#1d4ed8!important}
  #tab-daily{display:block!important}
  #daily-single-view{display:none!important}
  #daily-all-view{display:block!important}
  .daily-detail-wrap{padding:8px!important}
  .daily-all-person{border:1px solid #ccc!important;background:#f9f9f9!important;
    color:#000!important;page-break-inside:avoid!important;break-inside:avoid!important}
  .daily-all-person h4{color:#000!important}
  .daily-all-grid{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:12px!important}
  .daily-table{width:100%!important}
  .daily-table th{background:#ddd!important;color:#000!important;font-size:.75rem!important;padding:4px 6px!important}
  .daily-table td{color:#000!important;border-bottom:1px solid #ddd!important;font-size:.75rem!important;padding:4px 6px!important}
  .total-val{color:#1d4ed8!important}
  .shin-val{color:#059669!important}
  .daily-sum-card{background:#eee!important;border:1px solid #ccc!important;padding:6px!important}
  .daily-sum-card .label{color:#555!important;font-size:.7rem!important}
  .daily-sum-card .value{color:#000!important;font-size:1rem!important}
  .daily-summary{grid-template-columns:repeat(4,1fr)!important;gap:6px!important;margin-bottom:8px!important}
  .daily-all-section h3{color:#1d4ed8!important;font-size:.95rem!important;margin-bottom:8px!important}
  .content{padding:0!important}
}
@media(max-width:600px){.chart-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}

.daily-detail-wrap{padding:24px}
.daily-person-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.daily-ptab{padding:7px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.daily-ptab:hover,.daily-ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.daily-table-wrap{overflow-x:auto}
.daily-table{width:100%;border-collapse:collapse;font-size:.88rem}
.daily-table th{background:var(--surface2);color:var(--text2);padding:10px 14px;text-align:center;border-bottom:2px solid var(--border);font-weight:600;white-space:nowrap}
.daily-table th:first-child{text-align:left}
.daily-table td{padding:9px 14px;border-bottom:1px solid var(--border);text-align:center}
.daily-table td:first-child{text-align:left;color:var(--text2);font-weight:500}
.daily-table tr:hover td{background:var(--surface2)}
.daily-table .total-row td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border)}
.daily-table .shin-val{color:var(--shin);font-weight:600}
.daily-table .total-val{color:var(--accent);font-weight:600}
.daily-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.daily-sum-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.daily-sum-card .label{font-size:.75rem;color:var(--text2);margin-bottom:6px}
.daily-sum-card .value{font-size:1.5rem;font-weight:700}

.daily-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.daily-view-toggle{display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:3px}
.dv-btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600;background:transparent;color:var(--text2);transition:all .2s}
.dv-btn.active{background:var(--accent);color:#fff}
.daily-all-section{margin-bottom:36px;break-inside:avoid}
.daily-all-section h3{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.daily-all-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.daily-all-person{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;break-inside:avoid}
.daily-all-person h4{font-size:.95rem;font-weight:700;margin-bottom:10px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.daily-all-person h4 span{font-size:.78rem;color:var(--text2);font-weight:400}
@media print{
  header,.main-tabs,.daily-toolbar,.daily-person-tabs,.daily-view-toggle,#btn-view-single,#btn-view-all,.print-btn{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .tab-pane{display:block!important}
  #tab-overview,#tab-goals{display:none!important}
  #tab-daily{display:block!important}
  #daily-single-view{display:none!important}
  #daily-all-view{display:block!important}
  .daily-all-person{border:1px solid #ccc;background:#fff;color:#000;page-break-inside:avoid}
  .daily-all-person h4{color:#000}
  .daily-table th{background:#eee;color:#000}
  .daily-table td{color:#000;border-bottom:1px solid #ddd}
  .total-val{color:#1d4ed8!important}
  .shin-val{color:#059669!important}
  .daily-sum-card{background:#f8f8f8;border:1px solid #ddd;color:#000}
  .daily-sum-card .label{color:#555}
  .daily-sum-card .value{color:#000}
  .daily-all-section h3{color:#1d4ed8!important;border-color:#ccc}
}

.shinki-wrap{padding:24px}
.shinki-person-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.shinki-person-block h3{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--text)}
.shinki-table{width:100%;border-collapse:collapse;font-size:.85rem}
.shinki-table th{background:var(--surface2);padding:8px 12px;text-align:left;color:var(--text2);font-weight:600}
.shinki-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.shinki-table tr:last-child td{border-bottom:none}
.shinki-table tr:hover td{background:var(--surface2)}
.shinki-strategy{color:var(--shin);font-weight:700}
.shinki-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.shinki-filter-btn{padding:5px 14px;border:none;border-radius:16px;font-size:.82rem;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text2);transition:all .2s}
.shinki-filter-btn.active{background:#1d4ed8;color:#93c5fd}
/* 営業実績 */
.eigyo-wrap{padding:24px}
.eigyo-section{margin-bottom:36px}
.eigyo-section h3{font-size:1rem;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border);color:var(--text)}
.eigyo-monthly-table{width:100%;border-collapse:collapse;font-size:.82rem;overflow-x:auto;display:block}
.eigyo-monthly-table th{background:var(--surface2);padding:7px 10px;text-align:center;color:var(--text2);font-weight:600;white-space:nowrap;position:sticky;top:0}
.eigyo-monthly-table th.name-col{text-align:left;position:sticky;left:0;background:var(--surface2);z-index:2}
.eigyo-monthly-table td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--text);white-space:nowrap}
.eigyo-monthly-table td.name-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
.eigyo-monthly-table tr:hover td{background:var(--surface2)}
.eigyo-monthly-table .cur-month{color:var(--accent);font-weight:700}
.eigyo-monthly-table .blank{color:var(--text2)}
.eigyo-contracts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.eigyo-contracts-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.eigyo-contracts-card h4{font-size:.9rem;font-weight:700;margin-bottom:10px;color:var(--text)}
.eigyo-contracts-card .client-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.eigyo-contracts-card .client-row:last-child{border-bottom:none}
.eigyo-contracts-card .client-date{color:var(--text2);font-size:.78rem}
.eigyo-contracts-card .client-new{color:var(--shin);font-size:.75rem;font-weight:700}
.ranking-region-btn{padding:6px 16px;border:none;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text2);transition:all .2s}
.ranking-region-btn.active{background:#1d4ed8;color:#93c5fd}
.ranking-region-btn:hover:not(.active){background:var(--surface);color:var(--text)}
.ranking-section{margin-bottom:36px}
.ranking-section h3{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.ranking-table{width:100%;border-collapse:collapse}
.ranking-table th{background:var(--surface2);color:var(--text2);padding:10px 16px;text-align:left;font-size:.85rem;font-weight:600}
.ranking-table th:nth-child(3){text-align:right}
.ranking-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.9rem}
.ranking-table td:nth-child(3){text-align:right;font-weight:700}
.ranking-table tr:hover td{background:var(--surface2)}
.rank-1 td:first-child::before{content:"🥇 "}
.rank-2 td:first-child::before{content:"🥈 "}
.rank-3 td:first-child::before{content:"🥉 "}
.rank-bar-wrap{background:var(--surface2);border-radius:99px;height:8px;width:160px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:12px}
.rank-bar{height:100%;border-radius:99px}
.holiday-badge{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:.75rem;color:var(--text2);margin:2px;display:inline-block}


.history-wrap{padding:24px}
.history-month{margin-bottom:40px}
.history-month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.history-month-header h3{font-size:1.1rem;font-weight:700;color:var(--accent)}
.history-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.history-sum-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.history-sum-card .label{font-size:.75rem;color:var(--text2);margin-bottom:6px}
.history-sum-card .value{font-size:1.4rem;font-weight:700}
.history-table{width:100%;border-collapse:collapse;font-size:.88rem}
.history-table th{background:var(--surface2);color:var(--text2);padding:10px 14px;text-align:center;border-bottom:2px solid var(--border);font-weight:600;white-space:nowrap}
.history-table th:first-child{text-align:left}
.history-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:center}
.history-table td:first-child{text-align:left;font-weight:600}
.history-table tr:hover td{background:var(--surface2)}
.history-table .total-row td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border)}
.hist-rate{font-size:.8rem;padding:2px 8px;border-radius:99px}
.hist-rate.over{background:#14532d;color:#4ade80}
.hist-rate.near{background:#713f12;color:#facc15}
.hist-rate.low{background:#450a0a;color:#f87171}

/* ===== スプラッシュ画面 ===== */
#splash-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  background: linear-gradient(160deg, #0a0f1e 0%, #0f1e3a 50%, #0a0f1e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.7s ease;
}
#splash-screen.fade-out { opacity: 0; pointer-events: none; }
#splash-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  animation: splash-rise 0.9s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes splash-rise {
  from { opacity: 0; transform: scale(0.85) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
#splash-logo { filter: drop-shadow(0 0 28px rgba(59,130,246,0.55)); animation: splash-rise 0.9s cubic-bezier(0.22,1,0.36,1) both; }
#splash-title {
  font-size: clamp(3.2rem, 13vw, 5.5rem);
  font-weight: 800;
  letter-spacing: 0.2em;
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
  text-shadow: 0 0 48px rgba(99,179,255,0.45);
  animation: splash-rise 1s 0.12s cubic-bezier(0.22,1,0.36,1) both;
}
#splash-sub {
  font-size: clamp(0.75rem, 3.5vw, 1rem);
  color: rgba(180,210,255,0.6);
  letter-spacing: 0.22em;
  font-family: 'Segoe UI', Arial, sans-serif;
  animation: splash-rise 1.1s 0.22s cubic-bezier(0.22,1,0.36,1) both;
}
@media print { #splash-screen { display: none !important; } }

</style>

<div id="splash-screen">

      <svg width="96" height="96" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="url(#sg)"/>
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <text x="32" y="46" text-anchor="middle" font-size="38" font-weight="800" font-family="Arial,sans-serif" fill="white">N</text>
      </svg>
    </div>
    <div id="splash-title">NIPPO</div>
    <div id="splash-sub">～ 昨日よりも良い1日に ～</div>

</div>

(function(){
  var s = document.getElementById('splash-screen');
  setTimeout(function(){

    setTimeout(function(){ s.style.display='none'; }, 750);
  }, 2700);
})();
</script>

// Charts registry for destroy
const chartReg = {};
function mkChart(id, cfg){

// 棒グラフに数字ラベルを描画するプラグイン（グローバル登録）
Chart.register({
  id: 'barLabels',
  afterDatasetsDraw(chart) {
    if(chart.config.type !== 'bar') return;
    const ctx2 = chart.ctx;
    const isStacked = chart.config.data.datasets.length > 1 &&
      chart.config.data.datasets[0].stack;

    ctx2.save();
    ctx2.textAlign = 'center';
    ctx2.textBaseline = 'middle';

    if(isStacked) {
      // スタックグラフ: 合計を最上段バーの上に表示
      const nLabels = chart.config.data.labels.length;
      for(let i = 0; i < nLabels; i++) {
        let total = 0;
        let topMeta = null, topDataset = null;
        chart.config.data.datasets.forEach((ds, di) => {
          const val = ds.data[i] || 0;
          if(val > 0) {
            total += val;
            topMeta = chart.getDatasetMeta(di);
            topDataset = di;
          }
        });
        if(total === 0 || !topMeta) continue;
        const bar = topMeta.data[i];
        if(!bar) continue;
        const x = bar.x;
        const y = bar.y - 8;
        const displayVal = Number.isInteger(total) ? total : Math.round(total * 10) / 10;
        ctx2.font = 'bold 11px sans-serif';
        ctx2.fillStyle = '#e2e8f0';
        ctx2.fillText(displayVal, x, y);
      }
    } else {
      // 非スタック: 各バーの上に値を表示
      chart.config.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, i) => {
          const val = ds.data[i];
          if(!val || val === 0) return;
          const displayVal = Number.isInteger(val) ? val : Math.round(val * 10) / 10;
          ctx2.font = 'bold 11px sans-serif';
          ctx2.fillStyle = '#e2e8f0';
          ctx2.fillText(displayVal, bar.x, bar.y - 8);
        });
      });
    }
    ctx2.restore();
  }
});

function buildProgressTable(){
  let rows = RAW.targets.map(p=>{
    const s = RAW.person_summary[p];
    if(!s) return '';
    const g = goals[p];
    if(!g || NO_GOALS.has(p)) return `<tr><td style="font-weight:700">${p}</td><td style="color:var(--text2)">—</td><td style="font-weight:600">${fmt(s['総合_人工'])}</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">未設定</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">—</td><td style="color:#fb923c;font-weight:600">${fmt(s['新規_人工'])}</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">—</td><td style="color:var(--text2)">未設定</td></tr>`;
    const sTotal = s['総合_人工'], sShin = s['新規_人工'];
    const gTotal = g['総合'], gShin = g['新規'];
    const paceT = paceGoal(gTotal), paceSh = paceGoal(gShin);
    const gapT = sTotal - paceT, gapSh = sShin - paceSh;
    const rateT = sTotal/gTotal, rateSh = sShin/gShin;
    const barT = Math.min(100, Math.round(sTotal/gTotal*100));
    const barSh = Math.min(100, Math.round(sShin/gShin*100));
    const barColor = rateT>=1?'#4ade80':rateT>=0.85?'#facc15':'#f87171';
    const avgShin = workedDays>0 ? Math.round(sShin/workedDays*10)/10 : 0;
    const avgTotal = workedDays>0 ? Math.round(sTotal/workedDays*10)/10 : 0;
    return `<tr>
      <td style="font-weight:700;font-size:.95rem">${p}</td>
      <td style="color:var(--text2)">${fmt(gTotal)}</td>
      <td style="font-weight:600">${fmt(sTotal)}</td>
      <td style="color:#a78bfa;font-weight:600;font-size:.85rem">${avgTotal}</td>
      <td style="color:#4ade80;font-weight:600">${fmt(paceT)}</td>
      <td style="color:${gapT>=0?'#4ade80':'#fb923c'};font-weight:600">${gapT>=0?'+':''}${fmt(gapT)}</td>
      <td><span class="badge-rate ${rateClass(rateT)}">${Math.round(rateT*100)}%</span></td>
      <td><div class="progress-bar-wrap"><div class="progress-bar" style="width:${barT}%;background:${barColor}"></div></div></td>
      <td style="color:var(--text2)">${fmt(gShin)}</td>
      <td style="color:#fb923c;font-weight:600">${fmt(sShin)}</td>
      <td style="color:#a78bfa;font-weight:600;font-size:.85rem">${avgShin}</td>
      <td style="color:#4ade80;font-weight:600">${fmt(paceSh)}</td>
      <td style="color:${gapSh>=0?'#4ade80':'#fb923c'};font-weight:600">${gapSh>=0?'+':''}${fmt(gapSh)}</td>
      <td><span class="badge-rate ${rateClass(rateSh)}">${Math.round(rateSh*100)}%</span></td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>担当者</th>
      <th>月目標<br>総合</th><th>実績<br>総合</th><th style="color:#a78bfa">1日<br>平均</th><th>ペース<br>目標※</th><th>GAP</th><th>達成率</th><th>進捗</th>
      <th>月目標<br>新規</th><th>実績<br>新規</th><th style="color:#a78bfa">1日<br>平均</th><th>ペース<br>目標※</th><th>GAP</th><th>達成率</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderEigyo(){
  const el = document.getElementById('eigyo-content');
  const REGION_ORDER = ['本社','東京','仙台','警備'];

  // 実績稼働日数（確定値）
  const workedDaysActual = {
    '2026年4月': 20,
    '2026年5月': 17,
  };

  function weekdaysInMonth(yearNum, monthNum){
    const days = new Date(yearNum, monthNum, 0).getDate();
    let cnt = 0;
    for(let d=1; d<=days; d++){
      const wd = new Date(yearNum, monthNum-1, d).getDay();
      if(wd !== 0 && wd !== 6) cnt++;
    }
    return cnt;
  }

  // 当月ラベル
  const curLabel = (() => {
    const dr = RAW.data_range || '';
    const m = dr.match(/(\d+)年(\d+)月/);
    return m ? `${m[1]}年${m[2]}月` : '当月';
  })();

  function workedDaysForMonth(label, isCurrent, workedDates){
    if(isCurrent) return (workedDates || []).length || 20;
    if(workedDaysActual[label]) return workedDaysActual[label];
    const m = label.match(/(\d+)年(\d+)月/);
    if(!m) return 20;
    return weekdaysInMonth(parseInt(m[1]), parseInt(m[2]));
  }

  // 全地域のmonthsを収集
  const monthSet = new Set();
  REGION_ORDER.forEach(r => {
    const rd = ALL_REGIONS[r] || {};
    (rd.history || []).forEach(h => monthSet.add(h.month));
  });
  const months = [...monthSet].sort();
  months.push(curLabel);

  // 地域ごとにテーブルを構築
  function buildRegionBlock(region, key){
    const rd = ALL_REGIONS[region] || {};
    const targets = rd.targets || [];
    const ps = rd.person_summary || {};
    const history = rd.history || [];
    const workedDates = rd.worked_dates || [];

    // byPerson構築
    const byPerson = {};
    targets.forEach(p => { byPerson[p] = {}; });
    history.forEach(h => {
      (h.persons || []).forEach(pd => {
        if(!byPerson[pd.name]) byPerson[pd.name] = {};
        byPerson[pd.name][h.month] = {総合: pd.総合||0, 新規: pd.新規||0};
      });
    });
    Object.entries(ps).forEach(([name, pd]) => {
      if(!byPerson[name]) byPerson[name] = {};
      byPerson[name][curLabel] = {総合: pd['総合_人工']||0, 新規: pd['新規_人工']||0};
    });
    const persons = targets.filter(p => byPerson[p]);
    if(persons.length === 0) return '';

    const thCols = months.map((m,i) =>
      `<th${i===months.length-1?' class="cur-month"':''}>${m}</th>`
    ).join('');
    const rows = persons.map(p => {
      const tds = months.map((m,i) => {
        const raw = byPerson[p]?.[m]?.[key];
        if(raw == null || raw === 0) return `<td class="blank">—</td>`;
        const days = workedDaysForMonth(m, i===months.length-1, workedDates);
        const v = (raw / days).toFixed(1);
        return `<td${i===months.length-1?' class="cur-month"':''}>${v}</td>`;
      }).join('');
      return `<tr><td class="name-col">${p}</td>${tds}</tr>`;
    }).join('');

    return `<div style="margin-bottom:8px">
      <div style="font-size:.8rem;font-weight:700;color:var(--text2);padding:4px 0 4px 4px;border-left:3px solid var(--accent)">${region}</div>
      <div style="overflow-x:auto">
        <table class="eigyo-monthly-table">
          <thead><tr><th class="name-col">担当者</th>${thCols}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  // 新規契約実績（全地域）
  function buildContracts(){
    let html = '';
    REGION_ORDER.forEach(region => {
      const rd = ALL_REGIONS[region] || {};
      const targets = rd.targets || [];
      const shinki = rd.shinki_clients || {};
      const contractPersons = targets.filter(p => shinki[p]?.length > 0);
      if(contractPersons.length === 0) return;
      html += `<div style="margin-bottom:20px">
        <div style="font-size:.85rem;font-weight:700;color:var(--text2);margin-bottom:8px;padding:4px 0 4px 8px;border-left:3px solid var(--accent)">${region}</div>
        <div class="eigyo-contracts-grid">
        ${contractPersons.map(p => {
          const clients = shinki[p];
          const rows = clients.map(c => `
            <div class="client-row">
              <span>${c.name}</span>
              <span class="client-date">${c['契約日'].slice(0,7)}</span>
            </div>`).join('');
          return `<div class="eigyo-contracts-card">
            <h4>👤 ${p} <span style="color:var(--text2);font-weight:400;font-size:.8rem">${clients.length}件</span></h4>
            ${rows}
          </div>`;
        }).join('')}
        </div>
      </div>`;
    });
    return html || '<div style="color:var(--text2);padding:16px">データがありません</div>';
  }

  function buildSideBySide(key){
    const blocks = REGION_ORDER.map(r => buildRegionBlock(r, key)).filter(b => b);
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">${blocks.join('')}</div>`;
  }

  el.innerHTML = `<div class="eigyo-wrap">
    <div class="eigyo-toolbar no-print" style="display:flex;gap:8px;margin-bottom:20px">
      <button class="print-btn" onclick="printEigyo()">🖨️ PDF・印刷</button>
      <button class="print-btn" onclick="exportEigyoExcel()">📥 Excel出力</button>
    </div>
    <div class="eigyo-section">
      <h3>📊 新規 1日あたり出向数（月別）</h3>
      ${buildSideBySide('新規')}
    </div>
    <div class="eigyo-section">
      <h3>📦 総合 1日あたり出向数（月別）</h3>
      ${buildSideBySide('総合')}
    </div>
    <div class="eigyo-section">
      <h3>🏢 新規契約実績（直近2年以内）</h3>
      ${buildContracts()}
    </div>
  </div>`;
}

function renderRankingAll(){
  const el = document.getElementById('ranking-all-content');
  // 本社・東京・仙台の person_summary を統合
  const regions = ['本社', '東京', '仙台'];
  const merged = {};
  regions.forEach(region => {
    const ps = ALL_REGIONS[region].person_summary;
    Object.entries(ps).forEach(([name, d]) => {
      if(!merged[name]) merged[name] = {総合: 0, 新規: 0, 非稼働日: 0};
      merged[name].総合 += d.総合_人工 || 0;
      merged[name].新規 += d.新規_人工 || 0;
      merged[name].非稼働日 += d.非稼働日_人工 || 0;
    });
  });
  const totalRank = Object.entries(merged).map(([name,d])=>({name, value: d.総合})).sort((a,b)=>b.value-a.value);
  const shinRank  = Object.entries(merged).map(([name,d])=>({name, value: d.新規})).sort((a,b)=>b.value-a.value);
  const holRank   = Object.entries(merged).map(([name,d])=>({name, value: d.非稼働日})).sort((a,b)=>b.value-a.value);
  const maxTotal = totalRank[0]?.value || 1;
  const maxShin  = shinRank[0]?.value || 1;
  const maxHol   = holRank[0]?.value || 1;

  const workedDays = (RAW.worked_dates || RAW.dates).length;
  const lastDate2 = RAW.dates[RAW.dates.length-1];
  const holDays2 = (RAW.ranking?.非稼働日一覧||[]).filter(d=>d<=lastDate2).length || 1;

  function rankTable(data, maxVal, color, divDays){
    const showAvg = divDays > 0;
    return `<table class="ranking-table">
      <thead><tr><th>順位・担当者</th><th>グラフ</th><th>人工数</th>${showAvg?'<th>1日平均</th>':''}</tr></thead>
      <tbody>${data.map((d,i)=>`
      <tr class="rank-${i+1}">
        <td>${i+1}. ${d.name}</td>
        <td><div class="rank-bar-wrap"><div class="rank-bar" style="width:${maxVal>0?Math.round(d.value/maxVal*100):0}%;background:${color}"></div></div></td>
        <td>${fmt(d.value)}</td>
        ${showAvg?`<td style="color:var(--text2);font-size:.85rem">${(d.value/divDays).toFixed(1)}</td>`:''}
      </tr>`).join('')}
      </tbody>
    </table>`;
  }
  el.innerHTML = `
  <div style="padding:12px 0 4px;font-size:.82rem;color:var(--text2);text-align:center">本社・東京・仙台 集計（警備除く）</div>
  <div class="ranking-section">
    <h3><span style="color:#fb923c">🏅</span> 非稼働日出向ランキング（3拠点）</h3>
    ${rankTable(holRank, maxHol, '#fb923c', 0)}
  </div>
  <div class="ranking-section">
    <h3><span style="color:var(--accent)">📊</span> 総合出向数ランキング（3拠点）</h3>
    ${rankTable(totalRank, maxTotal, 'var(--accent)', workedDays)}
  </div>
  <div class="ranking-section">
    <h3><span style="color:var(--shin)">⭐</span> 新規出向数ランキング（3拠点）</h3>
    ${rankTable(shinRank, maxShin, 'var(--shin)', workedDays)}
  </div>`;
}

function renderDailyDetail(){
  const el = document.getElementById('daily-detail-content');
  const detail = RAW.daily_detail[currentDailyPerson] || {};
  const dates = Object.keys(detail).sort();
  let totSogou=0, totShinki=0;
  dates.forEach(d=>{
    totSogou  += detail[d].総合||0;
    totShinki += detail[d].新規||0;
  });
  // 月間ユニーク社数・現場数はperson_summaryから取得
  const ps = RAW.person_summary[currentDailyPerson];
  const totShaCount   = ps?.['月間社数']   || 0;
  const totGenbaCount = ps?.['月間現場数'] || 0;

  const rows = dates.map((d,idx) => {
    const v = detail[d];
    const shin_tok = (v.得意先||[]).filter(t=>t.区分==='新規');
    const kison_tok = (v.得意先||[]).filter(t=>t.区分!=='新規');
    const makeTokRows = (list, color, label) => list.length===0 ? '' :
      `<tr style="background:var(--surface);font-size:.75rem">
        <td colspan="5" style="padding:4px 12px;color:${color};font-weight:700;border-bottom:1px solid var(--border)">── ${label}（${list.length}社）──</td>
      </tr>` +
      list.map(t=>`<tr style="background:var(--surface2);font-size:.82rem">
        <td style="padding-left:28px;color:var(--text)">${t.name}</td>
        <td style="color:${color};font-weight:700;text-align:center">${fmt(t.人工)}</td>
        <td colspan="3"></td>
      </tr>`).join('');
    const tokRows = makeTokRows(shin_tok,'var(--shin)','新規') + makeTokRows(kison_tok,'var(--accent)','既存');
    return `<tr onclick="toggleTok(this)" style="cursor:pointer" data-tok="${encodeURIComponent(tokRows)}">
      <td>${d.slice(5)} <span style="font-size:.7rem;color:var(--text2)">▶</span></td>
      <td class="total-val">${fmt(v.総合)}</td>
      <td class="shin-val">${fmt(v.新規)}</td>
      <td>${v.社数}</td>
      <td>${v.現場数}</td>
    </tr>`;
  }).join('');;
  el.innerHTML = `
  <div class="daily-summary">
    <div class="daily-sum-card"><div class="label">総合出向（計）</div><div class="value total-val">${fmt(totSogou)}</div></div>
    <div class="daily-sum-card"><div class="label">新規出向（計）</div><div class="value shin-val">${fmt(totShinki)}</div></div>
    <div class="daily-sum-card"><div class="label">1日平均（総合）</div><div class="value" style="color:#a78bfa">${workedDays>0?Math.round(totSogou/workedDays*10)/10:0}</div></div>
    <div class="daily-sum-card"><div class="label">1日平均（新規）</div><div class="value shin-val" style="font-size:1.3rem">${workedDays>0?Math.round(totShinki/workedDays*10)/10:0}</div></div>
    <div class="daily-sum-card"><div class="label">社数（月間）</div><div class="value" style="color:var(--green)">${totShaCount}</div></div>
    <div class="daily-sum-card"><div class="label">現場数（月間）</div><div class="value" style="color:var(--orange)">${totGenbaCount}</div></div>
  </div>
  <div class="daily-table-wrap">
    <table class="daily-table">
      <thead><tr>
        <th>日付</th><th>総合出向</th><th>新規出向</th><th>社数</th><th>現場数</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total-row">
        <td>合計</td>
        <td class="total-val">${fmt(totSogou)}</td>
        <td class="shin-val">${fmt(totShinki)}</td>
        <td colspan="2" style="color:var(--text2);font-size:.8rem">月間ユニーク: ${totShaCount}社 / ${totGenbaCount}現場</td>
      </tr></tfoot>
    </table>

}

function buildPersonDailyTable(name){
  const detail = RAW.daily_detail[name] || {};
  const dates = Object.keys(detail).sort();
  const ps = RAW.person_summary[name];
  let totSogou=0, totShinki=0;
  dates.forEach(d=>{ totSogou+=detail[d].総合||0; totShinki+=detail[d].新規||0; });
  const shaCount   = ps['月間社数']   || 0;
  const genbaCount = ps['月間現場数'] || 0;
  const avgSogou = workedDays>0 ? Math.round(totSogou/workedDays*10)/10 : 0;
  const avgShinki = workedDays>0 ? Math.round(totShinki/workedDays*10)/10 : 0;
  const rows = dates.map(d=>{
    const v=detail[d];
    return `<tr>
      <td>${d.slice(5)}</td>
      <td class="total-val">${fmt(v.総合)}</td>
      <td class="shin-val">${fmt(v.新規)}</td>
      <td>${v.社数}</td>
      <td>${v.現場数}</td>
    </tr>`;
  }).join('');
  return `
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px">
    <div class="daily-sum-card" style="padding:8px"><div class="label">総合</div><div class="value total-val" style="font-size:1rem">${fmt(totSogou)}</div></div>
    <div class="daily-sum-card" style="padding:8px"><div class="label">新規</div><div class="value shin-val" style="font-size:1rem">${fmt(totShinki)}</div></div>
    <div class="daily-sum-card" style="padding:8px"><div class="label">平均総合</div><div class="value" style="font-size:1rem;color:#a78bfa">${avgSogou}</div></div>
    <div class="daily-sum-card" style="padding:8px"><div class="label">平均新規</div><div class="value shin-val" style="font-size:1rem">${avgShinki}</div></div>
    <div class="daily-sum-card" style="padding:8px"><div class="label">社数</div><div class="value" style="font-size:1rem;color:var(--green)">${shaCount}</div></div>
    <div class="daily-sum-card" style="padding:8px"><div class="label">現場数</div><div class="value" style="font-size:1rem;color:var(--orange)">${genbaCount}</div></div>
  </div>
  <div class="daily-table-wrap">
    <table class="daily-table" style="font-size:.82rem">
      <thead><tr><th>日付</th><th>総合</th><th>新規</th><th>社数</th><th>現場数</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total-row">
        <td>合計</td>
        <td class="total-val">${fmt(totSogou)}</td>
        <td class="shin-val">${fmt(totShinki)}</td>
        <td colspan="2" style="color:var(--text2);font-size:.78rem">${shaCount}社 / ${genbaCount}現場</td>
      </tr></tfoot>
    </table>
  </div>`;
}


function toggleTok(row){
  const next = row.nextElementSibling;
  if(next && next.classList.contains('tok-expand')){
    let cur = next;
    while(cur && cur.classList.contains('tok-expand')){
      const tmp = cur.nextElementSibling;
      cur.remove();
      cur = tmp;
    }
    return;
  }
  const html = decodeURIComponent(row.dataset.tok||'');
  if(!html) return;
  const tmp = document.createElement('tbody');
  tmp.innerHTML = html;
  const trs = Array.from(tmp.querySelectorAll('tr'));
  trs.forEach(tr => {
    tr.classList.add('tok-expand');
    row.parentNode.insertBefore(tr, row.nextSibling);
  });
}

function renderDailyAll(){
  const el = document.getElementById('daily-all-content');

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
// ===== 営業実績 エクスポート =====
function printEigyo(){
  const pane = document.getElementById('tab-eigyo');
  pane.classList.add('active-print');
  window.print();
  pane.classList.remove('active-print');
}

function exportEigyoExcel(){
  const REGION_ORDER = ['本社','東京','警備','仙台'];
  const workedDaysActual = {'2026年4月': 20};

  function weekdaysInMonth(y,m){
    const days=new Date(y,m,0).getDate(); let cnt=0;
    for(let d=1;d<=days;d++){const wd=new Date(y,m-1,d).getDay();if(wd!==0&&wd!==6)cnt++;}
    return cnt;
  }
  function workedDays(label, isCur, wdates){
    if(isCur) return (wdates||[]).length||20;
    if(workedDaysActual[label]) return workedDaysActual[label];
    const m=label.match(/(\d+)年(\d+)月/);
    return m?weekdaysInMonth(parseInt(m[1]),parseInt(m[2])):20;
  }

  const curLabel=(()=>{const dr=RAW.data_range||'';const m=dr.match(/(\d+)年(\d+)月/);return m?`${m[1]}年${m[2]}月`:'当月';})();
  const monthSet=new Set();
  REGION_ORDER.forEach(r=>(ALL_REGIONS[r]?.history||[]).forEach(h=>monthSet.add(h.month)));
  const months=[...monthSet].sort();months.push(curLabel);

  const wb = XLSX.utils.book_new();

  // シート①②: 新規・総合 出向数
  ['新規','総合'].forEach(key=>{
    const rows=[['拠点','担当者',...months]];
    REGION_ORDER.forEach(region=>{
      const rd=ALL_REGIONS[region]||{};
      const targets=rd.targets||[];
      const ps=rd.person_summary||{};
      const history=rd.history||[];
      const wdates=rd.worked_dates||[];
      const byPerson={};
      targets.forEach(p=>{byPerson[p]={};});
      history.forEach(h=>(h.persons||[]).forEach(pd=>{
        if(!byPerson[pd.name])byPerson[pd.name]={};
        byPerson[pd.name][h.month]={総合:pd.総合||0,新規:pd.新規||0};
      }));
      Object.entries(ps).forEach(([name,pd])=>{
        if(!byPerson[name])byPerson[name]={};
        byPerson[name][curLabel]={総合:pd['総合_人工']||0,新規:pd['新規_人工']||0};
      });
      targets.forEach(p=>{
        if(!byPerson[p])return;
        const row=[region,p];
        months.forEach((m,i)=>{
          const raw=byPerson[p]?.[m]?.[key];
          if(raw==null||raw===0){row.push('');}
          else{const d=workedDays(m,i===months.length-1,wdates);row.push(+(raw/d).toFixed(1));}
        });
        rows.push(row);
      });
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:8},{wch:14},...months.map(()=>({wch:10}))];
    XLSX.utils.book_append_sheet(wb,ws,`${key}_1日あたり出向数`);
  });

  // シート③: 新規契約実績
  const crows=[['拠点','担当者','得意先名','契約月']];
  REGION_ORDER.forEach(region=>{
    const rd=ALL_REGIONS[region]||{};
    const targets=rd.targets||[];
    const shinki=rd.shinki_clients||{};
    targets.forEach(p=>{
      (shinki[p]||[]).forEach(c=>{
        crows.push([region,p,c.name,c['契約日'].slice(0,7)]);
      });
    });
  });
  const ws3=XLSX.utils.aoa_to_sheet(crows);
  ws3['!cols']=[{wch:8},{wch:14},{wch:28},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws3,'新規契約実績');

  const today=new Date();
  const fname=`営業実績_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb,fname);
}
</script>
