name: NIPPO 自動更新

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 23:00 UTC = 翌08:00 JST
  workflow_dispatch:       # 手動実行ボタン

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install selenium pandas openpyxl

      - name: Chrome をセットアップ
        uses: browser-actions/setup-chrome@v1

      - name: config.py を Secrets から生成
        run: |
          python - <<'PYEOF'
          import os
          lines = [
              'BCSMS_URL    = "https://www.bcsms.work/bcsms/SPR"',
              f'BCSMS_ID     = "{os.environ["BCSMS_ID"]}"',
              f'BCSMS_PW     = "{os.environ["BCSMS_PW"]}"',
              f'GITHUB_TOKEN = "{os.environ["GH_PAT"]}"',
              'GITHUB_REPO  = "nii-taka/nippo"',
              'DOWNLOAD_DIR = "/tmp/nippo_excel"',
          ]
          with open("config.py", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("config.py 生成完了")
          PYEOF
        env:
          BCSMS_ID: ${{ secrets.BCSMS_ID }}
          BCSMS_PW: ${{ secrets.BCSMS_PW }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: NIPPO データ更新スクリプトを実行
        run: python bcsms_auto_update.py
        env:
          PYTHONIOENCODING: utf-8
          DISPLAY: ''

      - name: 変更をコミット・プッシュ
        run: |
          git config user.email "nii-taka@users.noreply.github.com"
          git config user.name "nii-taka"
          git add index.html
          git diff --cached --quiet || git commit -m "data: $(date '+%Y/%m/%d') 自動更新 [Actions]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: デバッグ用スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcsms-debug-screenshots
          path: /tmp/nippo_excel/*.png
          if-no-files-found: ignore
          retention-days: 3
